name: Repository Traffic Stats

on:
  schedule:
    - cron: "0 23 * * *"  # Run daily at 23:00 UTC
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  stats:
    name: Capture GitHub Traffic Stats
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create data directories
        run: |
          mkdir -p ghrs-data newsnapshots
          echo "Directories created in $(pwd)"
          ls -la

      - name: Capture traffic stats
        uses: jgehrcke/github-repo-stats@main
        with:
          repository: MeherBhaskar/temporal-debug-skill
          ghtoken: ${{ secrets.GHRS_GITHUB_API_TOKEN }}
          databranch: github-repo-stats

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4
        with:
          path: .
          token: ${{ secrets.GITHUB_TOKEN }}