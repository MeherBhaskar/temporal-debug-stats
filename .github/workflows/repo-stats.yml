name: Repository Traffic Stats

on:
  schedule:
    - cron: "0 23 * * *"  # Run daily at 23:00 UTC
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  stats:
    name: Capture GitHub Traffic Stats
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repository:
          - MeherBhaskar/temporal-debug-skill
          - MeherBhaskar/agent-rigor
          - MeherBhaskar/diffwhisperer
          - MeherBhaskar/OptiMindTune
          - MeherBhaskar/meherbhaskar.github.io
      fail-fast: false
    continue-on-error: true
    steps:
      - name: Capture traffic stats for ${{ matrix.repository }}
        uses: jgehrcke/github-repo-stats@RELEASE
        with:
          repository: ${{ matrix.repository }}
          ghtoken: ${{ secrets.GHRS_GITHUB_API_TOKEN }}
          databranch: github-repo-stats